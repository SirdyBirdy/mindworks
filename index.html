<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mindworks Counselling — A small Pune-based therapy practice. Certified, supervised psychologists. Online sessions across India.">
<title>Mindworks Counselling — Pune & Online</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- SHARED: sticky bar injected here -->
<div id="mw-sticky-bar"></div>

<!-- SHARED: desktop nav + mobile menu injected here -->
<div id="mw-nav"></div>

<!-- SHARED: mobile floating island injected here -->
<div id="mw-mobile-island"></div>

<!-- HERO -->
<section class="hero">
  <div class="hero-left">
    <div class="eyebrow">
      <span class="eyebrow-line"></span>
      <span class="eyebrow-text"></span>
    </div>
    <h1 class="hero-h1"></h1>
    <p class="hero-body"></p>
    <div class="hero-actions">
      <a href="#" class="btn-primary" target="_blank" rel="noopener">
        <span></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
      </a>
      <a href="#therapists" class="btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
      </a>
    </div>
  </div>
  <div class="hero-right">
    <div class="blob"></div>
    <div class="portrait-carousel" id="heroCarousel">
      <div class="portrait-deck" id="carouselDeck">
        <!-- Cards injected by main.js reading CONTENT.hero.deckCards -->
      </div>
      <button class="carousel-arrow carousel-arrow-prev" id="carouselPrev" aria-label="Previous team member">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="carousel-arrow carousel-arrow-next" id="carouselNext" aria-label="Next team member">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="carousel-dots" id="carouselDots"></div>
    </div>
    <div class="stat-float">
      <div class="stat-float-num"></div>
      <div class="stat-float-label"></div>
    </div>
    <div class="hero-ticker">
      <span class="ticker-dot"></span>
      <span class="hero-ticker-text"></span>
    </div>
  </div>
</section>

<!-- MARQUEE -->
<div class="marquee-wrap" aria-hidden="true">
  <div class="marquee-track"></div>
</div>

<!-- APPROACH -->
<section class="approach reveal" id="approach">
  <div class="approach-left">
    <div class="eyebrow">
      <span class="eyebrow-line"></span>
      <span class="eyebrow-text"></span>
    </div>
    <h2></h2>
    <p></p>
  </div>
  <div class="approach-right">
    <div class="approach-card reveal reveal-d1"><div class="ac-num"></div><div class="ac-title"></div><div class="ac-body"></div></div>
    <div class="approach-card reveal reveal-d2"><div class="ac-num"></div><div class="ac-title"></div><div class="ac-body"></div></div>
    <div class="approach-card reveal reveal-d3"><div class="ac-num"></div><div class="ac-title"></div><div class="ac-body"></div></div>
    <div class="approach-card reveal reveal-d4"><div class="ac-num"></div><div class="ac-title"></div><div class="ac-body"></div></div>
  </div>
</section>

<!-- TOPICS / BENTO -->
<section class="topics reveal" id="topics">
  <div class="topics-header">
    <div>
      <div class="eyebrow"><span class="eyebrow-line"></span></div>
      <h2></h2>
    </div>
    <a href="conditions/" style="font-size:0.78rem;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:0.4rem;transition:color 0.2s" onmouseover="this.style.color='var(--teal)'" onmouseout="this.style.color='var(--muted)'">
      View all
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
    </a>
  </div>
  <div class="bento">
    <!-- Cells injected by main.js reading CONTENT.topics.cells;
         whole grid made clickable → /conditions/ by js/topics-links.js -->
  </div>
</section>

<!-- THERAPISTS -->
<section class="therapists reveal" id="therapists">
  <div class="therapists-top">
    <div>
      <div class="eyebrow"><span class="eyebrow-line"></span></div>
      <h2 class="therapists-h"></h2>
    </div>
    <a href="therapists/" style="font-size:0.78rem;color:rgba(249,244,235,0.4);text-decoration:none;display:flex;align-items:center;gap:0.4rem;transition:color 0.2s" onmouseover="this.style.color='rgba(249,244,235,0.8)'" onmouseout="this.style.color='rgba(249,244,235,0.4)'">
      View all
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
    </a>
  </div>
  <div class="t-grid">
    <!-- Cards injected by main.js reading CONTENT.therapists.list -->
  </div>
</section>

<!-- ASSESSMENTS -->
<section class="assess reveal" id="assessments">
  <div class="assess-top">
    <div>
      <div class="eyebrow"><span class="eyebrow-line"></span></div>
      <h2></h2>
    </div>
    <p class="assess-sub"></p>
  </div>
  <div class="assess-grid">
    <!-- Cards injected by main.js reading CONTENT.assessments.cards -->
  </div>
</section>

<!-- PULL QUOTE -->
<section class="pull-quote reveal">
  <div>
    <div class="pq-label"></div>
    <div class="pq-accent-line"></div>
  </div>
  <div>
    <p class="pq-text"></p>
    <p class="pq-attr"></p>
  </div>
</section>

<!-- LOCATIONS -->
<section class="locations reveal" id="locations">
  <div class="locations-top">
    <div>
      <div class="eyebrow"><span class="eyebrow-line"></span></div>
      <h2></h2>
    </div>
    <p class="locations-sub"></p>
  </div>
  <div class="locations-grid">
    <!-- Cards injected by main.js reading CONTENT.locations.list -->
  </div>
</section>

<!-- FOOTER CTA -->
<div class="footer-cta reveal">
  <div class="fcta-bg" aria-hidden="true">mindworks</div>
  <div class="fcta-eyebrow"></div>
  <h2 class="fcta-h"></h2>
  <p class="fcta-sub"></p>
  <div class="fcta-actions">
    <a href="#" class="btn-cream" target="_blank" rel="noopener">
      <span></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
    </a>
    <a href="#" class="btn-ghost-dark" target="_blank" rel="noopener"></a>
  </div>
</div>

<!-- SHARED: footer injected here -->
<div id="mw-footer"></div>

<!-- SCRIPTS -->
<script src="js/content.js"></script>
<script src="js/shared.js"></script>
<script src="js/assessments.js"></script>
<script src="js/main.js"></script>
<script src="js/topics-links.js"></script>
<script src="js/hero-carousel.js"></script>
<script src="js/discovery-modal.js"></script>

</body>
</html>
